spring.application.name=qrent

# Datenbank – Werte kommen aus Umgebungsvariablen, sonst gelten die Standardwerte für lokal
spring.datasource.url=jdbc:mariadb://localhost:3306/${DB_NAME:qrent}
spring.datasource.username=${DB_USER:qrent}
spring.datasource.password=${DB_PASSWORD:qrent_dev}

# Das Schema verwaltet ausschließlich Flyway, Hibernate prüft nur
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true